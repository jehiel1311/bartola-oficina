<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Oficina · Bartola Beauty</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --fondo:#F8F6F4; --papel:#FFFFFF; --beige:#EDE3DC; --rosa:#E28E91; --rosa-claro:#F3D6D7;
  --tinta:#2A2A2A; --tinta-suave:#6B6360; --linea:#E6DCD5;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --fondo:#221F1E; --papel:#2C2826; --beige:#3A3330; --rosa:#E9A0A3; --rosa-claro:#4A3436;
    --tinta:#F3EDEA; --tinta-suave:#B8ADA8; --linea:#3E3734;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--fondo);color:var(--tinta)}
body{font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}

/* Entrada */
.entrada{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.entrada form{width:min(340px,100%);text-align:center}
.marca{font-family:var(--serif);font-weight:500;font-size:clamp(40px,10vw,56px);line-height:1;margin:0;letter-spacing:-.01em}
.marca-sub{margin:10px 0 36px;color:var(--tinta-suave);font-size:14px}
.campo{display:block;width:100%;padding:14px 16px;border:1px solid var(--linea);border-radius:999px;background:var(--papel);text-align:center;font-size:16px}
.campo:focus{border-color:var(--rosa);outline:none;box-shadow:0 0 0 3px var(--rosa-claro)}
.recordar{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 20px;font-size:13px;color:var(--tinta-suave)}
.recordar input{accent-color:var(--rosa)}
.boton{width:100%;padding:13px 16px;border:0;border-radius:999px;background:var(--tinta);color:var(--fondo);font-weight:600;cursor:pointer}
.boton:disabled{opacity:.6;cursor:wait}
.error{min-height:1.5em;margin:14px 0 0;color:#B4474C;font-size:13px}
@media (prefers-color-scheme: dark){.error{color:#F0A2A5}}

/* Oficina */
.oficina{max-width:960px;margin:0 auto;padding:40px 22px 64px}
.cabecera{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--linea)}
.cabecera h1{font-family:var(--serif);font-weight:500;font-size:clamp(30px,6vw,42px);line-height:1.05;margin:0}
.cabecera p{margin:6px 0 0;color:var(--tinta-suave);font-size:13px}
.salir{background:none;border:1px solid var(--linea);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--tinta-suave)}
.salir:hover{border-color:var(--rosa);color:var(--tinta)}

/* Lo que espera a cada uno: el elemento protagonista */
.esperan{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0;margin:34px 0 10px;border:1px solid var(--linea);border-radius:20px;overflow:hidden;background:var(--papel)}
.persona{padding:26px 26px 22px}
.persona + .persona{border-left:1px solid var(--linea)}
@media (max-width:600px){.persona + .persona{border-left:0;border-top:1px solid var(--linea)}}
.persona-cab{display:flex;align-items:baseline;gap:14px}
.cuenta{font-family:var(--serif);font-size:56px;line-height:.9;color:var(--rosa);font-variant-numeric:lining-nums}
.persona h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0}
.persona-cab .sub{display:block;font-size:13px;color:var(--tinta-suave)}
.persona ul{list-style:none;margin:18px 0 0;padding:0}
.persona li{padding:9px 0;border-top:1px dashed var(--linea);font-size:14px}
.persona li small{color:var(--tinta-suave)}
.persona .nada{color:var(--tinta-suave);font-style:italic;font-family:var(--serif);font-size:16px;margin-top:16px}

/* Filtro */
.filtro{display:flex;flex-wrap:wrap;gap:8px;margin:40px 0 6px}
.filtro button{border:1px solid var(--linea);background:transparent;border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer;color:var(--tinta-suave)}
.filtro button[aria-pressed="true"]{background:var(--rosa-claro);border-color:var(--rosa-claro);color:var(--tinta);font-weight:600}

/* Áreas */
.area{margin-top:34px}
.area > h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
.area > h2 small{font-family:var(--sans);font-size:13px;color:var(--tinta-suave);font-weight:400}
.tarea{display:grid;grid-template-columns:1fr auto;gap:4px 18px;padding:16px 0;border-bottom:1px solid var(--linea)}
.tarea h3{margin:0;font-size:15px;font-weight:600;line-height:1.4}
.tarea .id{color:var(--tinta-suave);font-weight:500;margin-right:6px}
.estado{grid-row:1/3;grid-column:2;align-self:start;white-space:nowrap;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--beige)}
.estado[data-e="PARA REVISAR"],.estado[data-e="PROPUESTA"],.estado[data-e="IDEA"]{background:var(--rosa-claro)}
.estado[data-e="EN CURSO"],.estado[data-e="APROBADO"]{background:var(--tinta);color:var(--fondo)}
.quien{font-size:13px;color:var(--tinta-suave)}
.quien .alta{color:#B4474C;font-weight:600}
@media (prefers-color-scheme: dark){.quien .alta{color:#F0A2A5}}
.nota{grid-column:1/-1;font-size:13px;color:var(--tinta-suave);max-width:70ch;overflow-wrap:anywhere}
.nota a{color:inherit}
details.cerradas{margin-top:8px}
details.cerradas summary{cursor:pointer;font-size:13px;color:var(--tinta-suave);padding:12px 0;list-style-position:inside}
details.cerradas .tarea{opacity:.7}
@media (max-width:520px){
  .tarea{grid-template-columns:1fr}
  .estado{grid-row:auto;grid-column:auto;justify-self:start}
}
.pie{margin-top:56px;font-size:12px;color:var(--tinta-suave)}
@media (prefers-reduced-motion:no-preference){
  .oficina{animation:aparecer .5s ease-out}
  @keyframes aparecer{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<main class="entrada" id="entrada">
  <form id="form" autocomplete="off">
    <h1 class="marca">Bartola</h1>
    <p class="marca-sub">Oficina de Flor y Yeyo</p>
    <input class="campo" id="clave" type="password" placeholder="Contraseña" aria-label="Contraseña" required autofocus>
    <label class="recordar"><input type="checkbox" id="recordar"> Recordarme en este dispositivo</label>
    <button class="boton" id="entrar" type="submit">Entrar</button>
    <p class="error" id="error" role="alert"></p>
  </form>
</main>

<div class="oficina" id="oficina" hidden>
  <header class="cabecera">
    <div>
      <h1>Oficina de Bartola</h1>
      <p id="actualizado"></p>
    </div>
    <button class="salir" id="salir" type="button">Salir</button>
  </header>

  <section class="esperan" id="esperan" aria-label="Lo que espera la decisión de cada uno"></section>

  <div class="filtro" role="group" aria-label="Mostrar tareas de">
    <button type="button" data-f="todo" aria-pressed="true">Todo</button>
    <button type="button" data-f="Flor" aria-pressed="false">Flor</button>
    <button type="button" data-f="Yeyo" aria-pressed="false">Yeyo</button>
  </div>

  <div id="areas"></div>

  <p class="pie">Se arma con el TABLERO de Drive. Si algo no coincide, manda Drive.</p>
</div>

<script>
const CERRADOS = ["HECHO","PUBLICADO","MEDIDO","DESCARTADO"];
const ESPERAN = ["PARA REVISAR","PROPUESTA","IDEA","POR VERIFICAR"];
const AREAS = {WEB:"Tienda web", OFICINA:"Oficina", MKT:"Marketing"};
const LLAVE_LOCAL = "bartola-oficina-clave";
let filas = [], filtro = "todo";

const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enlazar = s => esc(s).replace(/https?:\/\/[^\s;,)]+[^\s;,).]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);

async function abrir(clave){
  const r = await fetch("datos.json?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("sin-datos");
  const p = await r.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const llave = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.sal), iterations:p.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plano = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, llave, b64(p.datos));
  return JSON.parse(new TextDecoder().decode(plano));
}

function guardar(clave){ try{ localStorage.setItem(LLAVE_LOCAL, clave) }catch(e){} }
function leerGuardada(){ try{ return localStorage.getItem(LLAVE_LOCAL) }catch(e){ return null } }
function borrarGuardada(){ try{ localStorage.removeItem(LLAVE_LOCAL) }catch(e){} }

async function entrar(clave, recordar){
  const boton = $("#entrar"), error = $("#error");
  boton.disabled = true; boton.textContent = "Abriendo…"; error.textContent = "";
  try{
    const d = await abrir(clave);
    if(recordar) guardar(clave);
    filas = d.filas || [];
    $("#actualizado").textContent = "Actualizado el " + d.actualizado;
    $("#entrada").hidden = true; $("#oficina").hidden = false;
    pintar();
  }catch(e){
    borrarGuardada();
    error.textContent = e.message === "sin-datos"
      ? "No se pudieron cargar los datos. Probá de nuevo en un rato."
      : "Contraseña incorrecta.";
    $("#clave").select();
  }finally{
    boton.disabled = false; boton.textContent = "Entrar";
  }
}

function pintarEsperan(){
  const html = ["Flor","Yeyo"].map(p => {
    const suyas = filas.filter(f => f.Decide === p && ESPERAN.includes(f.Estado));
    const items = suyas.length
      ? `<ul>${suyas.map(f => `<li>${esc(f.Tarea)} <small>· ${esc(f.ID)}</small></li>`).join("")}</ul>`
      : `<p class="nada">Nada esperando. Al día.</p>`;
    return `<article class="persona">
      <div class="persona-cab"><span class="cuenta">${suyas.length}</span>
      <div><h2>${p}</h2><span class="sub">${suyas.length === 1 ? "espera su decisión" : "esperan su decisión"}</span></div></div>
      ${items}</article>`;
  }).join("");
  $("#esperan").innerHTML = html;
}

function tarea(f){
  const alta = f.Prioridad === "Alta" ? ` · <span class="alta">Alta</span>` : (f.Prioridad ? ` · ${esc(f.Prioridad)}` : "");
  return `<article class="tarea">
    <h3><span class="id">${esc(f.ID)}</span>${esc(f.Tarea)}</h3>
    <span class="estado" data-e="${esc(f.Estado)}">${esc(f.Estado)}</span>
    <div class="quien">Decide ${esc(f.Decide)} · Lo hace ${esc(f["Lo hace"])}${alta}</div>
    ${f["Notas / enlace"] ? `<div class="nota">${enlazar(f["Notas / enlace"])}</div>` : ""}
  </article>`;
}

function pintar(){
  pintarEsperan();
  const vista = filas.filter(f => filtro === "todo" || f.Decide === filtro || f["Lo hace"] === filtro);
  const grupos = {};
  vista.forEach(f => (grupos[f["Área"]] ||= []).push(f));
  const orden = Object.keys(grupos).sort((a,b) => (Object.keys(AREAS).indexOf(a)+99)%99 - (Object.keys(AREAS).indexOf(b)+99)%99);
  $("#areas").innerHTML = orden.length ? orden.map(a => {
    const abiertas = grupos[a].filter(f => !CERRADOS.includes(f.Estado));
    const cerradas = grupos[a].filter(f => CERRADOS.includes(f.Estado));
    return `<section class="area">
      <h2>${esc(AREAS[a] || a)} <small>${abiertas.length} abiertas</small></h2>
      ${abiertas.map(tarea).join("")}
      ${cerradas.length ? `<details class="cerradas"><summary>${cerradas.length} cerradas</summary>${cerradas.map(tarea).join("")}</details>` : ""}
    </section>`;
  }).join("") : `<p class="nada">No hay tareas para ${esc(filtro)}.</p>`;
}

$("#form").addEventListener("submit", e => { e.preventDefault(); entrar($("#clave").value, $("#recordar").checked); });
$("#salir").addEventListener("click", () => { borrarGuardada(); location.reload(); });
document.querySelectorAll(".filtro button").forEach(b => b.addEventListener("click", () => {
  filtro = b.dataset.f;
  document.querySelectorAll(".filtro button").forEach(x => x.setAttribute("aria-pressed", x === b));
  pintar();
}));

const guardada = leerGuardada();
if(guardada){ $("#recordar").checked = true; entrar(guardada, true); }
</script>
</body>
</html>
