<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Oficina · Bartola Beauty</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --fondo:#F8F6F4; --papel:#FFFFFF; --tinta:#2A2A2A; --suave:#6F625C; --linea:#E9DFD8;
  --rosa:#E28E91; --petalo:#F3D6D7; --beige:#EDE3DC; --ok-bg:#E3EEE6; --ok:#386B4D; --alerta:#9B4A4F;
  --flor:#A8545C; --flor-bg:#F6DDDF; --flor-borde:#E9AEB2;
  --yeyo:#5E4A42; --yeyo-bg:#E7DCD3; --yeyo-borde:#B9A493;
  --serif:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --fondo:#221F1E; --papel:#2C2826; --tinta:#F3EDEA; --suave:#C4B5AE; --linea:#463B36;
    --rosa:#E9A0A3; --petalo:#4A3436; --beige:#3A3330; --ok-bg:#2F3D33; --ok:#ABD6B7; --alerta:#F0A2A5;
    --flor:#F2B3B8; --flor-bg:#4A2F33; --flor-borde:#8A5157;
    --yeyo:#E3CDBE; --yeyo-bg:#3F3430; --yeyo-borde:#7D6658;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --fondo:#221F1E; --papel:#2C2826; --tinta:#F3EDEA; --suave:#C4B5AE; --linea:#463B36;
  --rosa:#E9A0A3; --petalo:#4A3436; --beige:#3A3330; --ok-bg:#2F3D33; --ok:#ABD6B7; --alerta:#F0A2A5;
  --flor:#F2B3B8; --flor-bg:#4A2F33; --flor-borde:#8A5157;
  --yeyo:#E3CDBE; --yeyo-bg:#3F3430; --yeyo-borde:#7D6658;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--tinta);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:4px}
:focus-visible{outline:2px solid var(--rosa);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
h1,h2,h3{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--suave)}

/* Entrada */
.entrada{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(60vw 50vw at 100% 0%, color-mix(in srgb,var(--petalo) 70%,transparent),transparent 70%),radial-gradient(55vw 45vw at 0% 100%, color-mix(in srgb,var(--beige) 80%,transparent),transparent 70%),var(--fondo)}
.entrada form{width:min(380px,100%);text-align:center;padding:40px 30px 30px;border-radius:30px;background:color-mix(in srgb,var(--papel) 88%,transparent);border:1px solid var(--linea);box-shadow:0 30px 70px -30px rgba(120,70,72,.35)}
.entrada .logo{width:170px;height:auto;margin:0 auto 6px;display:block}
.entrada p{margin:12px 0 26px;color:var(--suave);font-size:14px}
.campo{width:100%;padding:14px 16px;border:1px solid var(--linea);border-radius:999px;background:var(--papel);text-align:center;font-size:16px}
.campo:focus{outline:none;border-color:var(--rosa);box-shadow:0 0 0 3px var(--petalo)}
.recordar{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0 20px;font-size:13px;color:var(--suave)}
.recordar input{accent-color:var(--rosa)}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;border:1px solid var(--linea);background:var(--papel);cursor:pointer;text-decoration:none;font-size:14px}
.boton.primario{background:var(--tinta);color:var(--fondo);border-color:var(--tinta);font-weight:600}
.entrada .boton{width:100%;padding:13px}
.error{min-height:1.5em;margin:14px 0 0;color:var(--alerta);font-size:13px}

/* Estructura */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.shell > *{min-width:0}
aside{position:sticky;top:0;height:100vh;padding:28px 18px;background:var(--papel);border-right:1px solid var(--linea);display:flex;flex-direction:column}
aside .logo{width:138px;height:auto;display:block;margin:0 auto 28px}
nav.menu{display:grid;gap:4px}
.navitem{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:12px;background:none;text-align:left;cursor:pointer;font-size:14px}
.navitem .ic{color:var(--rosa)}
.navitem:hover{background:color-mix(in srgb,var(--petalo) 50%,transparent)}
.navitem[aria-current="page"]{background:var(--petalo);font-weight:600}
.navitem .num{margin-left:auto;font-size:11.5px;background:var(--fondo);border-radius:999px;padding:0 8px;font-weight:600}
.aside-pie{margin-top:auto;padding:16px 6px 0;border-top:1px solid var(--linea);font-size:12px;color:var(--suave);display:grid;gap:8px}
.aside-pie button{justify-self:start}
main{min-width:0;padding:24px 36px 56px;max-width:1180px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.personas{display:flex;gap:4px;padding:4px;border:1px solid var(--linea);border-radius:999px;background:var(--papel)}
.personas button{border:1px solid transparent;background:none;padding:7px 15px;border-radius:999px;cursor:pointer;font-size:13.5px}
.personas button[aria-pressed="true"][data-p="todo"]{background:var(--tinta);color:var(--fondo);font-weight:600}
.personas button[data-p="Flor"]{color:var(--flor)}
.personas button[data-p="Yeyo"]{color:var(--yeyo)}
.personas button[aria-pressed="true"][data-p="Flor"]{background:var(--flor-bg);border-color:var(--flor-borde);font-weight:600}
.personas button[aria-pressed="true"][data-p="Yeyo"]{background:var(--yeyo-bg);border-color:var(--yeyo-borde);font-weight:600}
.top .derecha{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.top .boton{padding:8px 14px;font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin:10px 2px 22px;font-size:12px;color:var(--suave)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .ic{width:14px;height:14px;color:var(--rosa)}
.pantalla > .cab{margin:6px 0 20px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;color:var(--suave);margin:0 0 6px}
.pantalla h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.4vw,46px);line-height:1.08;letter-spacing:-.01em}
.pantalla .cab p{margin:10px 0 0;color:var(--suave);max-width:62ch}
.titulo-sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 12px}
.titulo-sec h2{font-family:var(--serif);font-weight:500;font-size:25px}
.titulo-sec p{margin:2px 0 0;font-size:13px;color:var(--suave)}

/* Hero */
.hero{padding:28px 30px;border:1px solid var(--linea);border-radius:24px;background:radial-gradient(90% 140% at 100% 0%, var(--petalo), transparent 60%),radial-gradient(80% 120% at 0% 100%, var(--beige), transparent 60%),var(--papel)}
.hero .saludo{margin:0 0 6px;font-size:13px;color:var(--suave)}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,4.4vw,46px);line-height:1.08}
.hero .resumen{margin:12px 0 0;font-size:16px;max-width:62ch}
.cifras{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.cifra{padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--papel) 80%,transparent);border:1px solid var(--linea)}
.cifra b{display:block;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1}
.cifra span{font-size:12.5px;color:var(--suave)}
.cifra.flor b{color:var(--flor)} .cifra.yeyo b{color:var(--yeyo)} .cifra.ok b{color:var(--ok)}
@media (max-width:700px){.cifras{grid-template-columns:repeat(2,1fr)}}

/* Avisos */
.avisos{margin-top:18px;padding:14px 18px;border-left:3px solid var(--rosa);background:color-mix(in srgb,var(--petalo) 75%,transparent);border-radius:0 16px 16px 0}
.avisos h3{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:500;font-size:17px;margin-bottom:4px}
.avisos ul{margin:0;padding-left:18px;font-size:14px}

/* Tarjetas de tarea */
.tareas{display:grid;gap:10px}
.tarea{position:relative;padding:16px 18px 14px 22px;border:1px solid var(--linea);border-radius:18px;background:var(--papel);overflow:hidden}
.tarea::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--linea)}
.tarea.de-Flor{background:linear-gradient(100deg, color-mix(in srgb,var(--flor-bg) 55%,var(--papel)) 0%, var(--papel) 45%)}
.tarea.de-Flor::before{background:var(--flor)}
.tarea.de-Yeyo{background:linear-gradient(100deg, color-mix(in srgb,var(--yeyo-bg) 60%,var(--papel)) 0%, var(--papel) 45%)}
.tarea.de-Yeyo::before{background:var(--yeyo)}
.tarea .linea1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--suave)}
.tarea .num-dest{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--petalo);color:var(--tinta);font-family:var(--serif);font-size:15px}
.tarea.de-Yeyo .num-dest{background:var(--yeyo);color:var(--papel)}
.tarea h3{font-size:15.5px;font-weight:600;line-height:1.4;margin:8px 0 6px}
.tarea .linea2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--suave)}
.tarea .linea2 span{display:inline-flex;align-items:center;gap:5px}
.tarea .linea2 .ic{width:14px;height:14px}
.vieja,.alta{color:var(--alerta);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--beige);white-space:nowrap}
.chip .ic{width:13px;height:13px;stroke-width:2}
.chip.st-espera{background:var(--petalo)}
.chip.st-curso{background:var(--tinta);color:var(--fondo)}
.chip.st-cerrada,.chip.confirmado{background:var(--ok-bg);color:var(--ok)}
.chip.en-uso{background:var(--beige)}
.chip.falta{background:var(--petalo);color:var(--alerta)}
.decide{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--linea)}
.decide.Flor{background:var(--flor-bg);color:var(--flor);border-color:var(--flor-borde)}
.decide.Yeyo{background:var(--yeyo-bg);color:var(--yeyo);border-color:var(--yeyo-borde)}
.decide.Claudia,.decide.Chaty{background:var(--fondo)}
details.det{margin-top:8px}
details.det summary{cursor:pointer;font-size:13px;color:var(--suave);width:max-content}
details.det .cuerpo{margin-top:8px;padding:12px 14px;border-radius:12px;background:var(--fondo);font-size:13.5px;overflow-wrap:anywhere}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.copiar{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--rosa) 45%,var(--linea));background:var(--petalo);font-size:12.5px;font-weight:600;cursor:pointer}
.copiar .ic{width:14px;height:14px}
.copiar.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.abrir{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--rosa);padding:4px 0}
.abrir .ic{width:14px;height:14px;color:var(--rosa)}
.copia-manual{display:flex;gap:6px;align-items:center;margin-top:6px;width:100%}
.copia-manual input{flex:1;min-width:0;padding:6px 10px;border-radius:10px;border:1px solid var(--linea);background:var(--papel);font-size:12.5px}

/* Paneles por persona */
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.panel{padding:20px 22px;border-radius:22px;border:1px solid var(--linea);background:var(--papel)}
.panel.Flor{border-color:var(--flor-borde);background:linear-gradient(160deg,color-mix(in srgb,var(--flor-bg) 60%,var(--papel)),var(--papel) 55%)}
.panel.Yeyo{border-color:var(--yeyo-borde);background:linear-gradient(160deg,color-mix(in srgb,var(--yeyo-bg) 70%,var(--papel)),var(--papel) 55%)}
.panel header{display:flex;align-items:center;gap:12px}
.panel .av-caja{width:50px;height:50px}
.panel .av-caja .av{width:34px;height:34px}
.panel h3{font-family:var(--serif);font-weight:500;font-size:21px}
.panel .cuenta{margin-left:auto;font-family:var(--serif);font-size:40px;line-height:1}
.panel.Flor .cuenta{color:var(--flor)} .panel.Yeyo .cuenta{color:var(--yeyo)}
.panel .area{margin-top:14px}
.panel .area h4{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:12.5px;color:var(--suave)}
.panel ul{list-style:none;margin:0;padding:0}
.panel li{padding:7px 0;border-top:1px dashed var(--linea);font-size:13.5px}
.panel li small{color:var(--suave)}

/* Avatares (máscara: toman el color de cada persona) */
.av{display:inline-block;width:18px;height:18px;flex:none;background:currentColor;-webkit-mask:var(--img) center/contain no-repeat;mask:var(--img) center/contain no-repeat;vertical-align:-4px}
.av.Flor{--img:url("avatar-flor.png");color:var(--flor)}
.av.Yeyo{--img:url("avatar-yeyo.png");color:var(--yeyo)}
.av-caja{display:grid;place-items:center;border-radius:50%;flex:none}
.av-caja.Flor{background:var(--flor-bg);border:1px solid var(--flor-borde)}
.av-caja.Yeyo{background:var(--yeyo-bg);border:1px solid var(--yeyo-borde)}
.personas button{display:inline-flex;align-items:center;gap:7px}
.personas button[aria-pressed="true"] .av{color:inherit}
.decide .av,.linea2 .av{width:15px;height:15px;vertical-align:-3px}
.cifra .quien{display:flex;align-items:center;gap:6px}
.saludo-av{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.saludo-av .av-caja{width:52px;height:52px}
.saludo-av .av{width:34px;height:34px}

/* Avance por área */
.avances{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.avance{padding:16px 18px;border-radius:18px;border:1px solid var(--linea);background:var(--papel)}
.avance h3{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.avance h3 .ic{color:var(--rosa)}
.barra{height:8px;border-radius:999px;background:var(--fondo);border:1px solid var(--linea);overflow:hidden;margin:10px 0 6px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--petalo),var(--rosa))}
.avance p{margin:0;font-size:12.5px;color:var(--suave)}

/* Propuestas */
.propuestas{padding:20px 22px;border-radius:22px;border:1px dashed color-mix(in srgb,var(--yeyo-borde) 80%,var(--linea));background:color-mix(in srgb,var(--yeyo-bg) 35%,var(--papel))}
.propuestas ol{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.propuestas li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;border-radius:14px;background:var(--papel);border:1px solid var(--linea);font-size:14px}
.propuestas li b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--yeyo-bg);color:var(--yeyo);font-family:var(--serif);font-weight:500}
.propuestas small{display:block;color:var(--suave);font-size:12px}

/* Filtros */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filtros select{padding:9px 14px;border-radius:999px;border:1px solid var(--linea);background:var(--papel);font-size:13.5px}
.filtros .cuenta-tareas{font-size:13px;color:var(--suave)}
.ver-hechas{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--linea);background:var(--papel);font-size:13.5px;cursor:pointer}
.ver-hechas input{accent-color:var(--rosa);width:16px;height:16px}
.tarea.hecha{opacity:.72}
.tarea.hecha h3{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--suave) 60%,transparent)}
details.cerradas summary{cursor:pointer;margin-top:12px;font-size:13.5px;color:var(--suave)}

/* Grillas de tarjetas */
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:flex;flex-direction:column;padding:18px 20px;border-radius:20px;border:1px solid var(--linea);background:var(--papel)}
.card .cab-card{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ic-caja{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--petalo);flex:none}
.card h3{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.2}
.card .desc{font-size:13.5px;color:var(--suave);margin:0}
.card ul{margin:8px 0 0;padding-left:18px;font-size:13.5px}
.card .pie{margin-top:auto;padding-top:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.consejo{display:flex;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--fondo);font-size:13px}
.consejo .ic{color:var(--rosa);width:16px;height:16px;margin-top:2px}

/* Vistas previas */
.galeria .card{padding:0;overflow:hidden}
.preview{position:relative;aspect-ratio:4/5;background:linear-gradient(150deg,var(--petalo),var(--beige));display:grid;place-items:center;text-align:center;border-bottom:1px solid var(--linea)}
.preview.corta{aspect-ratio:16/9}
.preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--papel)}
.preview .marca{display:grid;gap:10px;justify-items:center;padding:20px}
.preview .marca .ic{width:46px;height:46px;stroke-width:1.2;color:var(--rosa)}
.preview .marca span{font-family:var(--serif);font-size:20px}
.galeria .card .info{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.etiqueta-tipo{font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--suave);margin:0 0 4px}
.segmentos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.segmentos button{padding:8px 15px;border-radius:999px;border:1px solid var(--linea);background:var(--papel);cursor:pointer;font-size:13.5px}
.segmentos button[aria-pressed="true"]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}

/* Manual */
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:700px){.swatches{grid-template-columns:repeat(3,1fr)}}
.swatch{border-radius:16px;overflow:hidden;border:1px solid var(--linea);background:var(--papel)}
.swatch i{display:block;height:70px}
.swatch b{display:block;font-size:12.5px;padding:8px 10px 0}
.swatch code{display:block;font-size:11.5px;color:var(--suave);padding:0 10px 9px;font-family:inherit}
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tipo{padding:14px 16px;border-radius:16px;border:1px solid var(--linea);background:var(--papel)}
.tipo .muestra{font-size:32px;line-height:1.1;margin:6px 0 8px}
.tipo .muestra.sin{font-size:14px;font-style:italic;color:var(--suave)}
.tipo p{margin:0;font-size:12.5px;color:var(--suave)}
.faltas{display:flex;gap:12px;padding:16px 18px;border-radius:18px;background:color-mix(in srgb,var(--petalo) 70%,transparent);margin-bottom:14px}
.faltas h3{font-size:14px;margin-bottom:4px}
.faltas ul{margin:0;padding-left:18px;font-size:13.5px}
.ancho{grid-column:1/-1}
.m-falta{margin:10px 0 0;font-size:13px;color:var(--alerta)}

/* Memoria */
.buscador{position:relative;max-width:620px}
.buscador .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--suave)}
.buscador input{width:100%;padding:13px 16px 13px 46px;border-radius:999px;border:1px solid var(--linea);background:var(--papel);font-size:15px}
.buscador input:focus{outline:none;border-color:var(--rosa);box-shadow:0 0 0 3px var(--petalo)}
.resultados{margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--papel);border:1px solid var(--linea)}
.resultados ul{list-style:none;margin:6px 0 0;padding:0}
.resultados li{padding:9px 0;border-top:1px dashed var(--linea);font-size:14px}
.resultados li small{display:block;color:var(--suave);font-size:12px}
.resultados mark{background:var(--petalo);color:inherit;border-radius:3px;padding:0 2px}
.pestanas{display:flex;gap:6px;overflow-x:auto;margin:18px 0 12px;padding-bottom:4px}
.pestanas button{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid var(--linea);background:var(--papel);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.pestanas button .ic{width:16px;height:16px;color:var(--rosa)}
.pestanas button[aria-selected="true"]{background:var(--tinta);color:var(--fondo);border-color:var(--tinta)}
.mem-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.mem-item{padding:14px 16px;border-radius:16px;background:var(--papel);border:1px solid var(--linea)}
.mem-item h4{display:flex;justify-content:space-between;gap:10px;margin:0 0 6px;font-size:14.5px}
.mem-item p{margin:0;font-size:13.5px}
.fuentes{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:16px}

/* Diálogo */
dialog{border:0;padding:0;border-radius:24px;width:min(480px,calc(100vw - 32px));background:var(--papel);color:var(--tinta);box-shadow:0 24px 60px rgba(42,42,42,.25)}
dialog::backdrop{background:rgba(42,42,42,.35);backdrop-filter:blur(3px)}
.d-cab{display:flex;gap:14px;align-items:center;padding:24px 24px 6px}
.d-cab h2{font-family:var(--serif);font-weight:500;font-size:23px}
.d-cab p{margin:2px 0 0;font-size:13px;color:var(--suave)}
.d-x{margin-left:auto;align-self:flex-start;background:none;border:0;padding:6px;border-radius:50%;cursor:pointer;color:var(--suave)}
.d-cuerpo{padding:8px 24px}
.d-cuerpo ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.d-pie{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:18px 24px 24px}

/* Móvil */
.menu-movil{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;padding:16px 16px 10px;border-right:0;border-bottom:1px solid var(--linea)}
  aside .logo{width:84px;margin:0 auto 10px}
  nav.menu{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  .navitem{width:auto;white-space:nowrap;padding:9px 12px}
  .navitem .num{margin-left:6px}
  .aside-pie{display:none}
  main{padding:18px 16px 48px}
}
@media (prefers-reduced-motion:no-preference){ .pantalla{animation:entra .35s ease-out} @keyframes entra{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>

<script>
const ES_PREVIA = location.pathname.includes("/vista-previa/");
const BASE = ES_PREVIA ? "../" : "";
const REPO = "jehiel1311/bartola-oficina";
const CERRADOS = ["HECHO","PUBLICADO","MEDIDO","DESCARTADO"];
const ESPERAN = ["PARA REVISAR","PROPUESTA","IDEA","POR VERIFICAR"];
const AREAS = {WEB:"Tienda web", OFICINA:"Oficina", MKT:"Marketing"};
const ICONO_AREA = {WEB:"tienda", OFICINA:"oficina", MKT:"megafono"};
const ICONO_ESTADO = {"IDEA":"idea","PARA REVISAR":"ojo","PROPUESTA":"lapiz","PARA HACER":"check","APROBADO":"check","EN CURSO":"play","PROBADO":"check","POR VERIFICAR":"lupa","PUBLICADO":"listo","HECHO":"listo","MEDIDO":"listo","DESCARTADO":"cerrar"};
const PRIORIDAD = {Alta:0, Media:1, Baja:2};
const LLAVE_CLAVE = "bartola-oficina-clave", LLAVE_TEMA = "bartola-oficina-tema";
let D = null, filas = [], vista = "todo", pantalla = "inicio", pestana = null, segmento = "todo", fArea = "todas", fEstado = "abiertas", verHechas = false;

const $ = s => document.querySelector(s);
const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const DIA = 86400000;
const hoyAR = () => { const a = new Date(Date.now() - 3*3600000); return Date.UTC(a.getUTCFullYear(), a.getUTCMonth(), a.getUTCDate()); };
const aFecha = t => { const m = /(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t || ""); return m ? Date.UTC(+m[3], +m[2]-1, +m[1]) : null; };
const diasDesde = f => { const t = aFecha(f); return t === null ? null : Math.round((hoyAR() - t) / DIA); };
const hace = n => n === null ? "" : n <= 0 ? "desde hoy" : n === 1 ? "hace 1 día" : `hace ${n} días`;
const abierta = f => !CERRADOS.includes(f.Estado);
const urlsDe = t => (String(t || "").match(/https?:\/\/[^\s;,)«»]+[^\s;,).«»]/g) || []).filter(u => !/x-access-token|github_pat_/i.test(u));
const enlazar = t => esc(t).replace(/https?:\/\/[^\s;,)«»]+[^\s;,).«»]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const deVista = f => vista === "todo" || f.Decide === vista || f["Lo hace"] === vista;
const fmtFecha = iso => { try{ return new Date(iso).toLocaleString("es-AR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", timeZone:"America/Argentina/Cordoba"}); }catch(e){ return null; } };

/* ---------- Acceso ---------- */
async function abrir(clave){
  const r = await fetch(BASE + "datos.json?t=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("sin-datos");
  const p = await r.json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(p.sal), iterations:p.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(p.iv)}, k, b64(p.datos))));
}
const guardar = (k, v) => { try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} };
const leer = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };

async function entrar(clave, recordar){
  const btn = $("#entrar"); btn.disabled = true; btn.textContent = "Abriendo…"; $("#error").textContent = "";
  try{
    D = await abrir(clave); filas = D.filas || [];
    if(recordar) guardar(LLAVE_CLAVE, clave);
    $("#entrada").hidden = true; $("#oficina").hidden = false;
    pintarTodo(); metaDiseno();
  }catch(e){
    guardar(LLAVE_CLAVE, null);
    $("#error").textContent = e.message === "sin-datos" ? "No se pudieron cargar los datos. Probá de nuevo en un rato." : "Contraseña incorrecta.";
  }finally{ btn.disabled = false; btn.textContent = "Entrar"; }
}

/* ---------- Copiar link ---------- */
async function copiar(btn, url){
  if(!/^https:\/\//.test(url) || /x-access-token|github_pat_/i.test(url)) return;
  const original = btn.innerHTML;
  try{
    if(!navigator.clipboard || !window.isSecureContext) throw new Error("sin-api");
    await navigator.clipboard.writeText(url);
    btn.classList.add("ok"); btn.innerHTML = `${ic("check")}Link copiado`;
    setTimeout(() => { btn.classList.remove("ok"); btn.innerHTML = original; }, 2200);
  }catch(e){
    if(btn.nextElementSibling?.classList.contains("copia-manual")) return;
    const caja = document.createElement("div"); caja.className = "copia-manual";
    caja.innerHTML = `<input readonly value="${esc(url)}" aria-label="Link para copiar"><span class="muted" style="font-size:12px">Seleccioná y copiá</span>`;
    btn.after(caja); const inp = caja.querySelector("input"); inp.focus(); inp.select();
  }
}
const btnCopiar = url => `<button type="button" class="copiar" data-url="${esc(url)}">${ic("link")}Copiar link</button>`;
const btnAbrir = (url, txt="Abrir") => `<a class="abrir" href="${esc(url)}" target="_blank" rel="noopener">${ic("afuera")}${esc(txt)}</a>`;

/* ---------- Metadatos ---------- */
function pintarMeta(extra){
  const partes = [];
  const datos = D?.datos_actualizados_en ? fmtFecha(D.datos_actualizados_en) : (D?.actualizado || null);
  partes.push(`<span>${ic("reloj")}Datos del TABLERO: ${datos ? esc(datos) + " · Generado por " + esc(D.actualizado_por || "Claudia") : "no disponible"}</span>`);
  partes.push(`<span>${ic("subir")}Diseño publicado: ${extra || "consultando…"}</span>`);
  if(ES_PREVIA) partes.push(`<span>${ic("ojo")}Esta es la VISTA PREVIA: la Oficina principal no cambió.</span>`);
  $("#meta").innerHTML = partes.join("");
}
async function metaDiseno(){
  pintarMeta();
  try{
    const ruta = ES_PREVIA ? "vista-previa/index.html" : "index.html";
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(ruta)}&per_page=1`);
    if(!r.ok) throw 0;
    const c = (await r.json())[0];
    pintarMeta(c ? `${esc(fmtFecha(c.commit.committer.date))} · commit ${esc(c.sha.slice(0,7))}` : "no disponible");
  }catch(e){ pintarMeta("no disponible"); }
}

/* ---------- Piezas comunes ---------- */
const claseEstado = e => CERRADOS.includes(e) ? "st-cerrada" : ["EN CURSO","PARA HACER","APROBADO"].includes(e) ? "st-curso" : ESPERAN.includes(e) ? "st-espera" : "";
const chipEstado = e => `<span class="chip ${claseEstado(e)}">${ic(ICONO_ESTADO[e] || "idea")}${esc(e.toLowerCase())}</span>`;
const ESTADO_TXT = {"confirmado":["Confirmado","listo"],"en-uso":["En uso, falta confirmar","reloj"],"falta":["Falta definir","idea"]};
const chip = e => { const [t, i] = ESTADO_TXT[e] || ESTADO_TXT.falta; return `<span class="chip ${e}">${ic(i)}${t}</span>`; };
const ES_PERSONA = p => p === "Flor" || p === "Yeyo";
const av = p => ES_PERSONA(p) ? `<span class="av ${p}" aria-hidden="true"></span>` : ic("persona");
const decide = p => `<span class="decide ${esc(p)}">${av(p)}Decide: ${esc(p)}</span>`;

function tarjetaTarea(f, num){
  const n = abierta(f) ? diasDesde(f.Fecha) : null;
  const urls = urlsDe(f["Notas / enlace"]);
  return `<article class="tarea de-${esc(f.Decide)}${abierta(f) ? "" : " hecha"}">
    <div class="linea1">${num ? `<span class="num-dest">${num}</span>` : ""}<span>${esc(AREAS[f["Área"]] || f["Área"])} · ${esc(f.ID)}</span>${chipEstado(f.Estado)}${decide(f.Decide)}</div>
    <h3>${esc(f.Tarea)}</h3>
    <div class="linea2"><span>${av(f["Lo hace"])}Lo hace ${esc(f["Lo hace"])}</span>
      ${f.Prioridad === "Alta" ? `<span class="alta">${ic("llama")}Prioridad alta</span>` : `<span>Prioridad ${esc((f.Prioridad || "").toLowerCase())}</span>`}

/* ---------- Inicio ---------- */

      ${Object.keys(AREAS).filter(a => porArea[a]).map(a => `<div class="area"><h4>${ic(ICONO_AREA[a])}${AREAS[a]} · ${porArea[a].length}</h4><ul>${porArea[a].map(f => `<li>${esc(f.Tarea)} <small>· ${esc(f.ID)}</small></li>`).join("")}</ul></div>`).join("") || `<p class="muted" style="margin:14px 0 0">Nada esperando. Al día.</p>`}</article>`; };
  const orden = vista === "Yeyo" ? ["Yeyo","Flor"] : vista === "Flor" ? ["Flor"] : ["Flor","Yeyo"];
  const props = (D.propuestas || []).slice().reverse();
  $("#p-inicio").innerHTML = `

      <h1>La Oficina de Bartola</h1>
      <p class="resumen">${vista === "todo" ? `Hay <strong>${ab.length} tareas abiertas</strong>: ${espera("Flor").length} esperan a Flor y ${espera("Yeyo").length} esperan a Yeyo.` : `Tenés <strong>${suyas.length} tareas abiertas</strong> donde decidís o hacés vos; ${espera(vista).length} esperan tu decisión.`} Elegí por dónde seguir; el resto queda ordenado por área.</p>
      <div class="cifras"><div class="cifra"><b>${ab.length}</b><span>abiertas</span></div><div class="cifra flor"><b>${espera("Flor").length}</b><span class="quien">${av("Flor")}esperan a Flor</span></div><div class="cifra yeyo"><b>${espera("Yeyo").length}</b><span class="quien">${av("Yeyo")}esperan a Yeyo</span></div><div class="cifra ok"><b>${cerradas}</b><span>cerradas</span></div></div>
    </div>
    ${avisos.length ? `<div class="avisos"><h3>${ic("campana")}Para tener en cuenta</h3><ul>${avisos.map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>` : ""}
    <div class="titulo-sec"><div><h2>Para avanzar</h2><p>Las tres más importantes${vista === "todo" ? "" : " tuyas"}: primero prioridad, después las que llevan más tiempo.</p></div><button class="boton" data-ir="pendientes">Ver todas →</button></div>

/* ---------- Pendientes ---------- */

/* ---------- Memoria + buscador ---------- */
const normal = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function resaltar(texto, q){ const t = String(texto || ""), i = normal(t).indexOf(q); if(i < 0) return esc(t.length > 160 ? t.slice(0,160) + "…" : t);
  const a = Math.max(0, i - 60), z = Math.min(t.length, i + q.length + 90);
  return (a ? "…" : "") + esc(t.slice(a, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length, z)) + (z < t.length ? "…" : ""); }
function buscar(qc){
  const caja = $("#resultados"), q = normal(qc.trim()); if(q.length < 2){ caja.hidden = true; return; }
  const r = [];
  (D.memoria?.secciones || []).forEach(x => x.items.forEach(i => { if(normal(i.t + " " + i.d).includes(q)) r.push({d:"Memoria · " + x.titulo, t:i.t, x:i.d}); }));
  (D.manual?.bloques || []).forEach(b => b.reglas.forEach(x => { if(normal(b.titulo + " " + x).includes(q)) r.push({d:"Manual · " + b.titulo, t:b.titulo, x}); }));
  (D.manual?.tipografias?.lista || []).forEach(t => { if(normal(t.nombre + " " + t.uso).includes(q)) r.push({d:"Manual · Tipografías", t:t.nombre, x:t.uso}); });
  filas.forEach(f => { if(normal(f.Tarea + " " + (f["Notas / enlace"] || "")).includes(q)) r.push({d:`Tarea ${f.ID} · ${f.Estado.toLowerCase()}`, t:f.Tarea, x:f["Notas / enlace"] || ""}); });
  (D.enlaces || []).forEach(e => { if(normal(e.nombre + " " + e.descripcion + " " + (e.detalle || []).join(" ")).includes(q)) r.push({d:"Acceso", t:e.nombre, x:e.descripcion}); });
  caja.hidden = false;
  caja.innerHTML = r.length ? `<strong>${r.length} ${r.length === 1 ? "resultado" : "resultados"}</strong><ul>${r.slice(0,25).map(x => `<li><strong>${resaltar(x.t, q)}</strong><small>${esc(x.d)}</small>${x.x ? `<div>${resaltar(x.x, q)}</div>` : ""}</li>`).join("")}</ul>`
    : `<strong>Sin resultados para «${esc(qc.trim())}»</strong><p class="muted" style="margin:6px 0 0;font-size:13px">Probá con otra palabra. Si no está en ningún lado, quizás haya que anotarlo en Drive.</p>`;
}
function pintarMemoria(){
  const M = D.memoria; if(!M){ $("#p-memoria").innerHTML = `<p class="muted">La memoria no está disponible.</p>`; return; }
  if(!pestana) pestana = M.secciones[0].id;
  const x = M.secciones.find(s => s.id === pestana) || M.secciones[0];

    <div class="buscador">${ic("lupa")}<input type="search" id="buscar" placeholder="Buscar en toda la Oficina: «margen», «Rocket», «Brittany»…" aria-label="Buscar en toda la Oficina" value="${esc(previo)}"></div>

    <article class="card" role="tabpanel"><div class="cab-card"><span class="ic-caja">${ic(x.icono)}</span><div><h3>${esc(x.titulo)}</h3><p class="desc">${esc(x.resumen)}</p></div></div>
      <div class="mem-items">${x.items.map(i => `<div class="mem-item"><h4><span>${esc(i.t)}</span>${chip(i.e)}</h4><p>${esc(i.d)}</p></div>`).join("")}</div>
      <div class="fuentes">${(x.fuentes || []).map(f => `${btnAbrir(f.url, f.nombre)}${btnCopiar(f.url)}`).join("")}</div></article>`;
  let t; $("#buscar").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => buscar(e.target.value), 150); });

/* ---------- Navegación ---------- */
function ir(p){
  pantalla = p;
  document.querySelectorAll("[data-pantalla]").forEach(s => s.hidden = s.dataset.pantalla !== p);
  document.querySelectorAll(".navitem").forEach(b => b.dataset.ir === p ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  if(history.replaceState) history.replaceState(null, "", "#" + p);
  window.scrollTo({top:0});
}
function pintarTodo(){
  $("#n-pend").textContent = filas.filter(abierta).filter(deVista).length;
  pintarInicio(); pintarPendientes(); pintarManual(); pintarMemoria(); pintarPrevias(); pintarAccesos();
  const h = location.hash.slice(1); ir(["inicio","pendientes","manual","memoria","previas","accesos"].includes(h) ? h : pantalla);
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button, a"); if(!t) return;
  if(t.dataset.ir){ ir(t.dataset.ir); return; }
  if(t.classList.contains("copiar")){ copiar(t, t.dataset.url); return; }
  if(t.dataset.tab){ pestana = t.dataset.tab; pintarMemoria(); return; }
  if(t.dataset.seg){ segmento = t.dataset.seg; pintarPrevias(); return; }
  if(t.dataset.detalle !== undefined){ abrirDetalle(D.enlaces[+t.dataset.detalle]); return; }
  if(t.hasAttribute("data-cerrar")){ $("#detalle").close(); return; }
  if(t.hasAttribute("data-cargar")){ const p = t.closest(".preview"); p.innerHTML = `<iframe loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" src="${esc(p.dataset.embed)}" title="Vista previa de Canva"></iframe>`; return; }
  if(t.dataset.p){ vista = t.dataset.p; document.querySelectorAll(".personas button").forEach(b => b.setAttribute("aria-pressed", b === t)); pintarTodo(); return; }
});
$("#detalle").addEventListener("click", ev => { if(ev.target === ev.currentTarget) ev.currentTarget.close(); });
$("#form").addEventListener("submit", e => { e.preventDefault(); entrar($("#clave").value, $("#recordar").checked); });
$("#salir").addEventListener("click", () => { guardar(LLAVE_CLAVE, null); location.hash = ""; location.reload(); });

/* Tema */
function aplicarTema(t){
  if(t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const oscuro = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#tema span").textContent = oscuro ? "Modo claro" : "Modo oscuro";
  document.querySelectorAll("picture source").forEach(s => s.media = oscuro ? "all" : "not all");
}
$("#tema").addEventListener("click", () => {
  const oscuro = document.documentElement.getAttribute("data-theme") ? document.documentElement.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const nuevo = oscuro ? "light" : "dark"; guardar(LLAVE_TEMA, nuevo); aplicarTema(nuevo);
});
aplicarTema(leer(LLAVE_TEMA));

const g = leer(LLAVE_CLAVE); if(g){ $("#recordar").checked = true; entrar(g, true); }
</script>
</body>
